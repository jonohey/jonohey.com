# Rebuilds the site each New Year so the footer copyright year
# (computed at build time) stays current without a manual deploy.
name: Yearly rebuild

on:
  schedule:
    - cron: "5 0 1 1 *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "VERCEL_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
