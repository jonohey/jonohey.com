# Runs Lighthouse (which includes axe-core's accessibility audits) against a
# production build of the site on every pull request. Thresholds live in
# lighthouserc.json.
name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One run per page is usually enough. Scores are noisy on shared
      # runners, so pages that fail are retried with more runs (the best run counts).
      - uses: treosh/lighthouse-ci-action@v12
        id: single-run
        continue-on-error: true
        with:
          configPath: ./lighthouserc.json
          runs: 1
          uploadArtifacts: true

      - name: List failed pages
        id: failed
        if: steps.single-run.outcome == 'failure'
        run: |
          {
            echo "urls<<EOF"
            jq -r '[.[] | select(.level == "error") | .url] | unique | .[]' .lighthouseci/assertion-results.json 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # If no failed pages could be read, urls is empty and every page in
      # lighthouserc.json is retried.
      - uses: treosh/lighthouse-ci-action@v12
        if: steps.single-run.outcome == 'failure'
        with:
          configPath: ./lighthouserc.json
          urls: ${{ steps.failed.outputs.urls }}
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-results-retry
