# Runs Lighthouse (which includes axe-core's accessibility audits) against a
# production build of the site on every pull request. Thresholds live in
# lighthouserc.json.
name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One run per page is usually enough. Scores are noisy on shared
      # runners, so a failure is retried with more runs (the best run counts).
      - uses: treosh/lighthouse-ci-action@v12
        id: single-run
        continue-on-error: true
        with:
          configPath: ./lighthouserc.json
          runs: 1
          uploadArtifacts: true

      - uses: treosh/lighthouse-ci-action@v12
        if: steps.single-run.outcome == 'failure'
        with:
          configPath: ./lighthouserc.json
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-results-retry
